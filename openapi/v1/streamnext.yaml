openapi: 3.0.3
info:
  title: StreamNext API
  version: 0.5.0
  description: REST contract for the StreamNext backend. Hand-written; the backend generates its server from this file.
servers:
  - url: /
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Liveness and database check
      tags: [System]
      security: []
      responses:
        '200':
          description: Service and database are healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Database is unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/auth/register:
    post:
      operationId: register
      summary: Create an account and its first session
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/login:
    post:
      operationId: login
      summary: Sign in with email and password
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/refresh:
    post:
      operationId: refresh
      summary: Exchange a refresh token for a new session
      description: |
        Rotates the refresh token: the presented token is revoked and a new pair is returned.
        Presenting a token that was already rotated revokes every refresh token of that user (a
        copy has leaked), except when it was rotated moments ago and its successor is unused (a
        lost response; the server then issues a fresh pair). A token revoked any other way (logout,
        a newer login on the same device, a password change or reset) is simply a 401 and signs
        nobody else out.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke a refresh token
      description: Idempotent and needs no bearer token. Always returns 200, even for an unknown token.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Logged out
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/apple:
    post:
      operationId: signInWithApple
      summary: Sign in or sign up with an Apple identity token
      description: |
        The client sends the identity token from Sign in with Apple together with the raw nonce it used
        (the server hashes it and compares it with the token's nonce claim). A known Apple account signs in;
        an unknown one is linked to the existing account with the same verified email, or becomes a new
        account. Linking to an account whose email was never verified first clears its password and
        revokes its sessions. The session is device-bound with a 90-day refresh lifetime.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleSignInRequest'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/auth/google:
    post:
      operationId: signInWithGoogle
      summary: Sign in or sign up with a Google ID token
      description: Same account rules as Sign in with Apple. The token's audience must be one of the configured Google client ids (iOS, Android or web).
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleSignInRequest'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Confirm an email address with the token from the verification email
      description: The token is single-use and valid for 24 hours. A token that is unknown, used, superseded or expired is a 400.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          description: Email verified
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/resend-verification:
    post:
      operationId: resendVerification
      summary: Send a new verification email
      description: At most one email per address per 60 seconds; a request inside that window is accepted and sends nothing.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Accepted. The same answer is given whether or not the address belongs to an account.
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/forgot-password:
    post:
      operationId: forgotPassword
      summary: Send a password-reset email
      description: At most one email per address per 60 seconds. Accounts without a password (Apple/Google sign-in) receive nothing.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Accepted. The same answer is given whether or not the address belongs to an account.
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/reset-password:
    post:
      operationId: resetPassword
      summary: Set a new password with the token from the reset email
      description: The token is single-use and valid for 1 hour. A weak password is rejected without consuming the token.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password changed; every refresh token of the user is revoked
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/me/change-password:
    post:
      operationId: changePassword
      summary: Change the signed-in user's password
      description: A wrong current password is 403, not 401, so clients do not mistake it for an expired access token. Accounts without a password get 400.
      tags: [Me]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed; all other sessions are revoked and a new session for this device is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/devices/{deviceId}:
    parameters:
      - name: deviceId
        in: path
        required: true
        description: The same client-generated id used when signing in
        schema:
          type: string
          format: uuid
    put:
      operationId: registerDevice
      summary: Register or update this device's push (FCM) token
      description: |
        An FCM token belongs to one device row: if another user registers the same token (someone else
        signed in on that device) it moves to them.
      tags: [Devices]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeviceRequest'
      responses:
        '204':
          description: Registered
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: removeDevice
      summary: Remove this device's push token
      description: Idempotent. Always 204, whether or not the device was registered.
      tags: [Devices]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Removed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/search/series:
    get:
      operationId: searchSeries
      summary: Search TV series
      description: |
        Searches TheTVDB's series. Names and overviews come in the signed-in user's profile language
        (`en` or `es`), falling back to English and then to the show's original language. Results are
        summaries only; opening one with `GET /v1/series/{seriesId}` stores the full series.
      tags: [Catalog]
      security:
        - bearerAuth: []
      parameters:
        - name: query
          in: query
          required: true
          description: 2 to 100 characters
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: page
          in: query
          required: false
          description: 20 results per page; TheTVDB limits a search to its first 5,000 results
          schema:
            type: integer
            minimum: 1
            maximum: 25
            default: 1
      responses:
        '200':
          description: One page of results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesSearchResults'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/series/{seriesId}:
    parameters:
      - $ref: '#/components/parameters/SeriesId'
    get:
      operationId: getSeries
      summary: Get a series
      description: |
        A stored series is served from our database and is kept current by a background job. A series
        nobody has opened yet is fetched from TheTVDB on this first request.
      tags: [Catalog]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The series, with its seasons
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/series/{seriesId}/episodes:
    parameters:
      - $ref: '#/components/parameters/SeriesId'
    get:
      operationId: listEpisodes
      summary: List a series' episodes
      description: In the series' default order, by season and episode number. Season 0 holds specials.
      tags: [Catalog]
      security:
        - bearerAuth: []
      parameters:
        - name: season
          in: query
          required: false
          description: Only this season
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: The episodes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpisodeList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/me:
    get:
      operationId: getMe
      summary: Get the signed-in user's profile
      tags: [Me]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      operationId: updateMe
      summary: Update the signed-in user's profile
      tags: [Me]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: deleteMe
      summary: Delete the signed-in user's account
      description: |
        Permanently deletes the account and everything that belongs to it. Accounts with a password must
        send it (a wrong or missing password is 403); accounts without one need only the access token.
      tags: [Me]
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
      responses:
        '204':
          description: Account deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  parameters:
    SeriesId:
      name: seriesId
      in: path
      required: true
      description: TheTVDB's id for the series
      schema:
        type: integer
        format: int64
        minimum: 1
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 15-minute access token from register, login or refresh.
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated, but not allowed (for example a wrong current password)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No such resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: A dependency is unavailable, or the feature is not configured on this server
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, invalid or expired credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, deviceId]
      properties:
        email:
          type: string
          maxLength: 254
          example: ana@example.com
        password:
          type: string
          minLength: 10
          maxLength: 128
        displayName:
          type: string
          minLength: 1
          maxLength: 40
          description: Defaults to the part of the email before the @
        timezone:
          type: string
          description: IANA timezone name; defaults to UTC
          example: America/Bogota
        deviceId:
          type: string
          format: uuid
          description: Client-generated, stable per install; binds the refresh token to the device
        rememberMe:
          type: boolean
          default: false
          description: Refresh token lasts 90 days instead of 24 hours
    LoginRequest:
      type: object
      required: [email, password, deviceId]
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          maxLength: 128
        deviceId:
          type: string
          format: uuid
        rememberMe:
          type: boolean
          default: false
    RefreshRequest:
      type: object
      required: [refreshToken, deviceId]
      properties:
        refreshToken:
          type: string
        deviceId:
          type: string
          format: uuid
    LogoutRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    UpdateProfileRequest:
      type: object
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 40
        timezone:
          type: string
          description: IANA timezone name
        language:
          $ref: '#/components/schemas/Language'

    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: From the link in the verification email
    EmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          maxLength: 254
    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
          description: From the link in the reset email
        newPassword:
          type: string
          minLength: 10
          maxLength: 128
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword, deviceId]
      properties:
        currentPassword:
          type: string
          maxLength: 128
        newPassword:
          type: string
          minLength: 10
          maxLength: 128
        deviceId:
          type: string
          format: uuid
          description: The device that receives the new session
        rememberMe:
          type: boolean
          default: false
    DeleteAccountRequest:
      type: object
      properties:
        password:
          type: string
          maxLength: 128
          description: Required for accounts that have a password
    AppleSignInRequest:
      type: object
      required: [identityToken, nonce, deviceId]
      properties:
        identityToken:
          type: string
          description: The identity token (a JWT) from Sign in with Apple
        nonce:
          type: string
          description: The raw nonce; its SHA-256 was sent to Apple with the authorization request
        deviceId:
          type: string
          format: uuid
        displayName:
          type: string
          maxLength: 40
          description: Apple shares the user's name only on the first authorization, via the client
    GoogleSignInRequest:
      type: object
      required: [idToken, deviceId]
      properties:
        idToken:
          type: string
          description: The Google ID token (a JWT)
        deviceId:
          type: string
          format: uuid
    RegisterDeviceRequest:
      type: object
      required: [fcmToken, platform]
      properties:
        fcmToken:
          type: string
          minLength: 1
          maxLength: 4096
        platform:
          type: string
          enum: [ios, android]
    Language:
      type: string
      enum: [en, es]
      description: Language of names and overviews the user wants to see
    SeriesStatus:
      type: string
      enum: [continuing, ended, upcoming, unknown]
    Genre:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: In the user's language
    SeriesSummary:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        originalName:
          type: string
        overview:
          type: string
        year:
          type: string
        network:
          type: string
        status:
          $ref: '#/components/schemas/SeriesStatus'
        image:
          type: string
          description: Poster thumbnail URL on TheTVDB's CDN
    SeriesSearchResults:
      type: object
      required: [results, page, hasMore]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SeriesSummary'
        page:
          type: integer
        hasMore:
          type: boolean
    SeasonSummary:
      type: object
      required: [number, episodeCount]
      properties:
        number:
          type: integer
          description: Season 0 holds specials
        name:
          type: string
        image:
          type: string
        episodeCount:
          type: integer
    SeriesDetail:
      type: object
      required: [id, slug, name, originalName, overview, status, airsDays, genres, seasons, syncedAt]
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        name:
          type: string
          description: In the user's language, falling back to English, then the original
        originalName:
          type: string
        overview:
          type: string
        image:
          type: string
        status:
          $ref: '#/components/schemas/SeriesStatus'
        firstAired:
          type: string
          format: date
        lastAired:
          type: string
          format: date
        nextAired:
          type: string
          format: date
        airsTime:
          type: string
          description: Local time in the series' country, as TheTVDB gives it
          example: '21:00'
        airsDays:
          type: array
          items:
            type: string
            enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
        originalCountry:
          type: string
          description: TheTVDB's three-letter country code
        originalLanguage:
          type: string
          description: TheTVDB's three-letter language code
        network:
          type: string
        averageRuntime:
          type: integer
          description: Minutes
        genres:
          type: array
          items:
            $ref: '#/components/schemas/Genre'
        seasons:
          type: array
          items:
            $ref: '#/components/schemas/SeasonSummary'
        syncedAt:
          type: string
          format: date-time
          description: When our copy was last refreshed from TheTVDB
    Episode:
      type: object
      required: [id, seasonNumber, number, name]
      properties:
        id:
          type: integer
          format: int64
        seasonNumber:
          type: integer
        number:
          type: integer
        absoluteNumber:
          type: integer
        name:
          type: string
        overview:
          type: string
        aired:
          type: string
          format: date
          description: Absent while unannounced
        runtime:
          type: integer
          description: Minutes
        image:
          type: string
        finaleType:
          type: string
    EpisodeList:
      type: object
      required: [episodes]
      properties:
        episodes:
          type: array
          items:
            $ref: '#/components/schemas/Episode'
    Session:
      type: object
      required: [accessToken, refreshToken, expiresIn, user]
      properties:
        accessToken:
          type: string
          description: JWT, valid for expiresIn seconds
        refreshToken:
          type: string
          description: Opaque; store it securely (iOS Keychain behind FaceID) and rotate on every use
        expiresIn:
          type: integer
          description: Access token lifetime in seconds
          example: 900
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      required: [id, email, emailVerified, displayName, timezone, language]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        emailVerified:
          type: boolean
        displayName:
          type: string
        timezone:
          type: string
        language:
          $ref: '#/components/schemas/Language'

    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          description: Server version (semver)
          example: 0.1.0
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable code
          example: unavailable
        message:
          type: string
          description: Human-readable detail
