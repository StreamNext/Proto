openapi: 3.0.3
info:
  title: StreamNext API
  version: 0.3.0
  description: REST contract for the StreamNext backend. Hand-written; the backend generates its server from this file.
servers:
  - url: /
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Liveness and database check
      tags: [System]
      security: []
      responses:
        '200':
          description: Service and database are healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Database is unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/auth/register:
    post:
      operationId: register
      summary: Create an account and its first session
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/login:
    post:
      operationId: login
      summary: Sign in with email and password
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/refresh:
    post:
      operationId: refresh
      summary: Exchange a refresh token for a new session
      description: |
        Rotates the refresh token: the presented token is revoked and a new pair is returned.
        Presenting an already-revoked token revokes every refresh token of that user, except
        when it was rotated moments ago and its successor is unused (a lost response; the
        server then issues a fresh pair).
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke a refresh token
      description: Idempotent and needs no bearer token. Always returns 200, even for an unknown token.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Logged out
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Confirm an email address with the token from the verification email
      description: The token is single-use and valid for 24 hours. A token that is unknown, used, superseded or expired is a 400.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          description: Email verified
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/resend-verification:
    post:
      operationId: resendVerification
      summary: Send a new verification email
      description: At most one email per address per 60 seconds; a request inside that window is accepted and sends nothing.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Accepted. The same answer is given whether or not the address belongs to an account.
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/forgot-password:
    post:
      operationId: forgotPassword
      summary: Send a password-reset email
      description: At most one email per address per 60 seconds. Accounts without a password (Apple/Google sign-in) receive nothing.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Accepted. The same answer is given whether or not the address belongs to an account.
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/reset-password:
    post:
      operationId: resetPassword
      summary: Set a new password with the token from the reset email
      description: The token is single-use and valid for 1 hour. A weak password is rejected without consuming the token.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password changed; every refresh token of the user is revoked
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/me/change-password:
    post:
      operationId: changePassword
      summary: Change the signed-in user's password
      description: A wrong current password is 403, not 401, so clients do not mistake it for an expired access token. Accounts without a password get 400.
      tags: [Me]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed; all other sessions are revoked and a new session for this device is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/me:
    get:
      operationId: getMe
      summary: Get the signed-in user's profile
      tags: [Me]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      operationId: updateMe
      summary: Update the signed-in user's profile
      tags: [Me]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: deleteMe
      summary: Delete the signed-in user's account
      description: |
        Permanently deletes the account and everything that belongs to it. Accounts with a password must
        send it (a wrong or missing password is 403); accounts without one need only the access token.
      tags: [Me]
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
      responses:
        '204':
          description: Account deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 15-minute access token from register, login or refresh.
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated, but not allowed (for example a wrong current password)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, invalid or expired credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, deviceId]
      properties:
        email:
          type: string
          maxLength: 254
          example: ana@example.com
        password:
          type: string
          minLength: 10
          maxLength: 128
        displayName:
          type: string
          minLength: 1
          maxLength: 40
          description: Defaults to the part of the email before the @
        timezone:
          type: string
          description: IANA timezone name; defaults to UTC
          example: America/Bogota
        deviceId:
          type: string
          format: uuid
          description: Client-generated, stable per install; binds the refresh token to the device
        rememberMe:
          type: boolean
          default: false
          description: Refresh token lasts 90 days instead of 24 hours
    LoginRequest:
      type: object
      required: [email, password, deviceId]
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          maxLength: 128
        deviceId:
          type: string
          format: uuid
        rememberMe:
          type: boolean
          default: false
    RefreshRequest:
      type: object
      required: [refreshToken, deviceId]
      properties:
        refreshToken:
          type: string
        deviceId:
          type: string
          format: uuid
    LogoutRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    UpdateProfileRequest:
      type: object
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 40
        timezone:
          type: string
          description: IANA timezone name
    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: From the link in the verification email
    EmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          maxLength: 254
    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
          description: From the link in the reset email
        newPassword:
          type: string
          minLength: 10
          maxLength: 128
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword, deviceId]
      properties:
        currentPassword:
          type: string
          maxLength: 128
        newPassword:
          type: string
          minLength: 10
          maxLength: 128
        deviceId:
          type: string
          format: uuid
          description: The device that receives the new session
        rememberMe:
          type: boolean
          default: false
    DeleteAccountRequest:
      type: object
      properties:
        password:
          type: string
          maxLength: 128
          description: Required for accounts that have a password
    Session:
      type: object
      required: [accessToken, refreshToken, expiresIn, user]
      properties:
        accessToken:
          type: string
          description: JWT, valid for expiresIn seconds
        refreshToken:
          type: string
          description: Opaque; store it securely (iOS Keychain behind FaceID) and rotate on every use
        expiresIn:
          type: integer
          description: Access token lifetime in seconds
          example: 900
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      required: [id, email, emailVerified, displayName, timezone]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        emailVerified:
          type: boolean
        displayName:
          type: string
        timezone:
          type: string
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          description: Server version (semver)
          example: 0.1.0
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable code
          example: unavailable
        message:
          type: string
          description: Human-readable detail
